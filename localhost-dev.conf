# Local HTTPS for dev server (fixdev-dev :3001) via mkcert CA.
# Cert in /etc/ssl/local-dev, CA installed into system trust store.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    ssl_certificate     /etc/ssl/local-dev/localhost.pem;
    ssl_certificate_key /etc/ssl/local-dev/localhost-key.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:3001;
    }
}
